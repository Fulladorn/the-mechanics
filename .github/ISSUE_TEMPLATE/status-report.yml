name: PM Status Report
description: Auto-generated weekly progress digest (also usable as a pinned status issue).
title: "📊 Status — Week of YYYY-MM-DD"
labels: ["status-report"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is generated by the **PM Agent** or the `pm-report.yml` workflow.
        Update it each week by invoking `@project-manager` with "status report".

  - type: textarea
    id: status
    attributes:
      label: Status
      description: >
        CI on main, open items from docs/ROADMAP.md, and open classes in
        docs/gameplay-issues.md. Auto-filled by the PM agent.
      placeholder: |
        | Item | Status | Notes |
        |---|---|---|
        | CI on main | ✅ green | |
        | #10 Driving / travel steps | 🟡 open | needs a driving bot |
        | Level 2 design | ⬜ not started | |
    validations:
      required: false

  - type: textarea
    id: next-priorities
    attributes:
      label: Next 3 priorities
      placeholder: |
        1. #12 — Close gameplay-issue class #10 (driving check)
        2. #15 — Fuse-grid unit test
        3. #8 — Performance pass at Medium on target hardware
    validations:
      required: false

  - type: textarea
    id: blockers
    attributes:
      label: Blockers & open design questions
      placeholder: |
        - #9 [Design] Wolf behavior during drive phase — needs creator decision
    validations:
      required: false
