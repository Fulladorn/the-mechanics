<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23ff7a2f'/%3E%3Cpath d='M20 44l16-16m-4-8a8 8 0 1 0 12 12' stroke='%23141820' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>The Mechanics</title>
    <style>
      :root {
        --orange: #ff7a2f;
        --orange-2: #ffa25e;
        --cream: #f3e9cf;
        --paper: #f6efdc;
        --ink: #141820;
        --ink-2: #2a303c;
        --teal: #4fd1b5;
        --good: #5fd08a;
        --warn: #ffb347;
        --bad: #ff5a4f;
        --glass: rgba(16, 20, 28, 0.66);
        --glass-2: rgba(16, 20, 28, 0.82);
        --line: rgba(255, 255, 255, 0.12);
        --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
        --body: 'Inter', system-ui, sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0c0f15; }
      body { font-family: var(--body); color: #f4f1ea; user-select: none; -webkit-user-select: none; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      .hidden { display: none !important; }

      /* ================= HUD ================= */
      #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      #hud.off { display: none; }

      #reticle { position: fixed; left: 50%; top: 50%; width: 0; height: 0; }
      #reticle .dot {
        position: absolute; left: -3px; top: -3px; width: 6px; height: 6px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.9); box-shadow: 0 0 0 1.5px rgba(0, 0, 0, 0.35);
        transition: transform 0.12s ease, background 0.12s;
      }
      #reticle.on .dot { transform: scale(0.6); background: var(--orange-2); }
      #reticle svg { position: absolute; left: -34px; top: -34px; width: 68px; height: 68px; overflow: visible; }
      #reticle .ring { fill: none; stroke: rgba(255, 255, 255, 0.0); stroke-width: 2.5; transition: stroke 0.12s; }
      #reticle.on .ring { stroke: rgba(255, 196, 140, 0.55); }
      #reticle .hold { fill: none; stroke: var(--orange); stroke-width: 4; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 34px 34px; }
      #reticle .band { fill: none; stroke: var(--good); stroke-width: 6; transform: rotate(-90deg); transform-origin: 34px 34px; opacity: 0; }
      #reticle .torque { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 34px 34px; opacity: 0; }
      #reticle.torquing .band, #reticle.torquing .torque { opacity: 1; }
      #reticle.inband .torque { stroke: var(--good); }
      #reticle.over .torque { stroke: var(--bad); }

      #prompt {
        position: fixed; left: 50%; top: calc(50% + 70px); transform: translateX(-50%);
        display: flex; flex-direction: column; align-items: center; gap: 4px; opacity: 0; transition: opacity 0.1s;
      }
      #prompt.show { opacity: 1; }
      #prompt .row { display: flex; align-items: center; gap: 8px; background: var(--glass); padding: 6px 12px 6px 6px; border-radius: 999px; border: 1px solid var(--line); backdrop-filter: blur(6px); }
      #prompt .key {
        min-width: 26px; height: 26px; padding: 0 7px; border-radius: 7px; background: var(--cream); color: var(--ink);
        font: 800 15px var(--display); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 #b9ae93;
      }
      #prompt .key.hold::after { content: ' hold'; font-size: 11px; margin-left: 3px; opacity: 0.7; }
      #prompt .label { font: 600 17px var(--display); letter-spacing: 0.4px; text-shadow: 0 1px 2px rgba(0,0,0,0.4); }
      #prompt .why { font: 500 13px var(--body); color: var(--warn); background: rgba(16,20,28,0.55); padding: 3px 10px; border-radius: 999px; }
      #prompt.disabled .key { background: #8c8575; box-shadow: 0 2px 0 #5d584c; }
      #prompt.disabled .label { opacity: 0.7; }

      #objective {
        position: fixed; left: 22px; top: 20px; max-width: 380px;
        background: linear-gradient(90deg, var(--glass-2), rgba(16,20,28,0.35));
        border-left: 4px solid var(--orange); border-radius: 4px 12px 12px 4px; padding: 10px 16px 11px 14px;
        transition: transform 0.35s cubic-bezier(.2,1.3,.4,1), opacity 0.3s;
      }
      #objective .tag { font: 700 11px var(--display); letter-spacing: 2.5px; color: var(--orange-2); text-transform: uppercase; }
      #objective .text { font: 700 22px var(--display); letter-spacing: 0.3px; line-height: 1.1; margin-top: 2px; }
      #objective .detail { font: 500 13.5px var(--body); opacity: 0.82; margin-top: 4px; line-height: 1.35; }
      #objective.pop { transform: translateX(10px); }
      #objective .clock { position: absolute; right: 12px; top: 10px; font: 600 12px var(--display); opacity: 0.6; letter-spacing: 1px; }
      #objective .tag { padding-right: 52px; }

      #waypoint { position: fixed; left: 0; top: 0; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 2px; transition: opacity 0.2s; }
      #waypoint .pin { width: 18px; height: 18px; transform: rotate(45deg); border: 3px solid var(--orange); background: rgba(255,122,47,0.25); box-shadow: 0 0 12px rgba(255,122,47,0.6); }
      #waypoint .dist { font: 700 13px var(--display); letter-spacing: 1px; text-shadow: 0 1px 3px rgba(0,0,0,0.7); }
      #waypoint.edge .pin { border-radius: 50% 50% 50% 0; }

      #belt { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 6px; align-items: flex-end; }
      #belt .slot {
        width: 54px; height: 54px; border-radius: 12px; background: var(--glass); border: 1.5px solid var(--line);
        display: flex; align-items: center; justify-content: center; position: relative; transition: transform 0.12s, border-color 0.12s;
      }
      #belt .slot svg { width: 30px; height: 30px; stroke: #f4f1ea; opacity: 0.92; }
      #belt .slot.empty svg { opacity: 0; }
      #belt .slot.sel { border-color: var(--orange); transform: translateY(-4px); background: rgba(40, 28, 20, 0.75); }
      #belt .slot .n { position: absolute; top: 3px; left: 6px; font: 700 11px var(--display); opacity: 0.55; }
      #carry { position: fixed; left: 50%; bottom: 86px; transform: translateX(-50%); font: 600 15px var(--display); letter-spacing: 0.6px;
        background: var(--glass); padding: 5px 14px; border-radius: 999px; border: 1px solid var(--line); opacity: 0; transition: opacity 0.2s; white-space: nowrap; }
      #carry.show { opacity: 1; }
      #carry b { color: var(--orange-2); }
      #carry .k { display: inline-block; background: var(--cream); color: var(--ink); border-radius: 4px; padding: 0 5px; margin: 0 2px; font-weight: 800; }

      #vitals { position: fixed; left: 22px; bottom: 22px; display: flex; flex-direction: column; gap: 7px; width: 210px; }
      #vitals .meter { display: flex; align-items: center; gap: 8px; transition: opacity 0.4s; }
      #vitals .meter.off { opacity: 0; }
      #vitals .meter span { font: 700 12px var(--display); letter-spacing: 1.5px; width: 52px; opacity: 0.85; }
      #vitals .bar { flex: 1; height: 8px; border-radius: 99px; background: rgba(255,255,255,0.12); overflow: hidden; }
      #vitals .bar i { display: block; height: 100%; width: 100%; border-radius: 99px; transition: width 0.2s; }
      #vitals .hp i { background: linear-gradient(90deg, #ff6b57, #ff9a6b); }
      #vitals .cold i { background: linear-gradient(90deg, #7fd6ff, #d9f3ff); }
      #vitals .stam i { background: linear-gradient(90deg, #e9d99a, #fff2c2); }

      #drive { position: fixed; right: 26px; bottom: 24px; text-align: right; opacity: 0; transition: opacity 0.3s; }
      #drive.show { opacity: 1; }
      #drive .spd { font: 800 64px var(--display); line-height: 0.9; letter-spacing: -1px; font-variant-numeric: tabular-nums; text-shadow: 0 2px 10px rgba(0,0,0,0.35); }
      #drive .unit { font: 700 13px var(--display); letter-spacing: 3px; opacity: 0.7; }
      #drive .integ { margin-top: 10px; display: flex; gap: 8px; align-items: center; justify-content: flex-end; font: 700 12px var(--display); letter-spacing: 1.5px; }
      #drive .integ .bar { width: 150px; height: 8px; border-radius: 99px; background: rgba(255,255,255,0.14); overflow: hidden; }
      #drive .integ i { display: block; height: 100%; background: linear-gradient(90deg, var(--good), #b8f0a0); transition: width 0.25s, background 0.25s; }
      #drive .keys { margin-top: 8px; font: 500 12px var(--body); opacity: 0.6; }

      #radio {
        position: fixed; left: 50%; bottom: 118px; transform: translateX(-50%) translateY(10px); max-width: min(760px, 86vw);
        display: flex; gap: 12px; align-items: flex-start; background: var(--glass-2); border: 1px solid var(--line);
        border-radius: 14px; padding: 10px 16px 11px 10px; opacity: 0; transition: opacity 0.25s, transform 0.25s;
      }
      #radio.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      #radio .who { font: 800 12px var(--display); letter-spacing: 2px; color: var(--orange-2); text-transform: uppercase; white-space: nowrap; display: flex; align-items: center; gap: 6px; padding-top: 3px; }
      #radio .who .wave { display: flex; gap: 2px; align-items: center; height: 14px; }
      #radio .who .wave i { width: 3px; background: var(--orange-2); border-radius: 2px; animation: wav 0.6s ease-in-out infinite; }
      #radio .who .wave i:nth-child(2) { animation-delay: 0.1s; } #radio .who .wave i:nth-child(3) { animation-delay: 0.2s; }
      #radio .who .wave i:nth-child(4) { animation-delay: 0.3s; }
      @keyframes wav { 0%, 100% { height: 3px; } 50% { height: 13px; } }
      #radio .line { font: 500 16px/1.4 var(--body); color: #f8f4ea; }

      #stamp { position: fixed; left: 50%; top: 22%; transform: translate(-50%, -50%) rotate(-4deg) scale(1.6); opacity: 0; text-align: center;
        pointer-events: none; transition: none; }
      #stamp.show { animation: stamp 2.4s cubic-bezier(.2,1.4,.4,1) forwards; }
      #stamp .t { display: inline-block; font: 800 44px var(--display); letter-spacing: 3px; color: var(--good); border: 5px solid currentColor; border-radius: 10px; padding: 2px 18px 0; text-shadow: 0 2px 12px rgba(0,0,0,0.3); background: rgba(10, 30, 18, 0.35); }
      #stamp.warn .t { color: var(--warn); background: rgba(40, 28, 10, 0.35); }
      #stamp.bad .t { color: var(--bad); background: rgba(40, 10, 10, 0.35); }
      #stamp .s { display: block; font: 700 18px var(--display); letter-spacing: 1.5px; margin-top: 8px; text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
      @keyframes stamp { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(-4deg) scale(1.7); } 12% { opacity: 1; transform: translate(-50%, -50%) rotate(-4deg) scale(0.96); }
        18% { transform: translate(-50%, -50%) rotate(-4deg) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) rotate(-4deg) scale(1); } }

      #toast { position: fixed; left: 50%; top: 86px; transform: translateX(-50%); font: 600 16px var(--display); letter-spacing: 0.6px;
        background: var(--glass); padding: 6px 16px; border-radius: 999px; border: 1px solid var(--line); opacity: 0; transition: opacity 0.2s; }
      #toast.show { opacity: 1; }

      #hurt { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.35s;
        background: radial-gradient(ellipse at center, transparent 55%, rgba(200, 30, 20, 0.55) 100%); }
      #frost { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1s;
        background: radial-gradient(ellipse at center, transparent 50%, rgba(190, 230, 255, 0.6) 100%); }

      #panelhelp { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); text-align: center; background: var(--glass-2);
        border: 1px solid var(--line); border-radius: 14px; padding: 12px 20px; max-width: 560px; }
      #panelhelp h4 { font: 800 20px var(--display); letter-spacing: 1.5px; color: var(--orange-2); }
      #panelhelp p { font: 500 14px/1.45 var(--body); opacity: 0.9; margin-top: 3px; }

      /* ---------- Job sheet (clipboard) ---------- */
      #jobsheet { position: fixed; right: 40px; top: 50%; transform: translateY(-50%) rotate(1.2deg); width: 430px; pointer-events: none;
        background: var(--paper); color: var(--ink); border-radius: 8px; padding: 42px 26px 22px; box-shadow: 0 20px 60px rgba(0,0,0,0.45), 0 0 0 10px #8a6a44;
        opacity: 0; transition: opacity 0.18s, transform 0.25s cubic-bezier(.2,1.2,.4,1); }
      #jobsheet.show { opacity: 1; transform: translateY(-50%) rotate(-0.8deg); }
      #jobsheet::before { content: ''; position: absolute; top: -18px; left: 50%; transform: translateX(-50%); width: 130px; height: 38px; border-radius: 8px;
        background: linear-gradient(#c9ccd2, #8f949c); box-shadow: 0 3px 0 #6c7078; }
      #jobsheet h2 { font: 800 30px var(--display); letter-spacing: 1px; line-height: 1; }
      #jobsheet .sub { font: 600 13px var(--display); letter-spacing: 2px; text-transform: uppercase; opacity: 0.55; margin-top: 4px; }
      #jobsheet .sys { display: grid; grid-template-columns: 28px 1fr auto; gap: 2px 10px; align-items: center; padding: 10px 0; border-bottom: 1.5px dashed rgba(20,24,32,0.18); }
      #jobsheet .sys svg { width: 24px; height: 24px; stroke: var(--ink); }
      #jobsheet .sys .nm { font: 700 18px var(--display); letter-spacing: 0.3px; }
      #jobsheet .sys .chip { font: 800 12px var(--display); letter-spacing: 1.5px; padding: 2px 8px; border-radius: 4px; border: 2px solid currentColor; }
      #jobsheet .sys .chip.go { color: #1f8a4a; } #jobsheet .sys .chip.broken { color: #c2362c; } #jobsheet .sys .chip.unknown { color: #7b7466; }
      #jobsheet .sys .chip.opt { color: #8a6a1f; }
      #jobsheet .sys .nx { grid-column: 2 / 4; font: 500 13px/1.35 var(--body); color: #4a4f5a; }
      #jobsheet .sys.done .nm { text-decoration: line-through; text-decoration-thickness: 2px; opacity: 0.6; }
      #jobsheet .foot { display: flex; justify-content: space-between; margin-top: 12px; font: 700 13px var(--display); letter-spacing: 1.5px; opacity: 0.7; }
      #jobsheet .scrawl { font: italic 500 14px var(--body); color: #3b5bb5; margin-top: 10px; transform: rotate(-1deg); }

      #fade { position: fixed; inset: 0; background: #07090d; pointer-events: none; opacity: 0; transition: opacity 0.6s; z-index: 40; }
      #fade.on { opacity: 1; }

      #letterbox { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
      #letterbox::before, #letterbox::after { content: ''; position: fixed; left: 0; right: 0; height: 0; background: #000; transition: height 0.6s ease; }
      #letterbox::before { top: 0; } #letterbox::after { bottom: 0; }
      #letterbox.on::before, #letterbox.on::after { height: 9vh; }
      #cinecap { position: fixed; left: 50%; bottom: 13vh; transform: translateX(-50%); text-align: center; z-index: 31; opacity: 0; transition: opacity 0.6s; pointer-events: none; }
      #cinecap.show { opacity: 1; }
      #cinecap .a { font: 700 14px var(--display); letter-spacing: 5px; color: var(--orange-2); }
      #cinecap .b { font: 800 56px var(--display); letter-spacing: 3px; line-height: 1; text-shadow: 0 4px 24px rgba(0,0,0,0.5); }
      #skiphint { position: fixed; right: 24px; bottom: 11vh; font: 600 13px var(--display); letter-spacing: 1.5px; opacity: 0.6; z-index: 31; }

      /* ---------- Loading ---------- */
      #loading { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(ellipse at 50% 40%, #1d2433, #0b0e14 70%); }
      #loading .logo { font: 800 64px var(--display); letter-spacing: 6px; }
      #loading .logo em { color: var(--orange); font-style: normal; }
      #loading .bar { width: 320px; height: 6px; border-radius: 99px; background: rgba(255,255,255,0.1); overflow: hidden; }
      #loading .bar i { display: block; width: 0%; height: 100%; background: var(--orange); transition: width 0.25s; }
      #loading .msg { font: 600 14px var(--display); letter-spacing: 3px; opacity: 0.7; text-transform: uppercase; }
      #loading .tip { position: absolute; bottom: 48px; max-width: 560px; text-align: center; font: 500 15px/1.5 var(--body); opacity: 0.75; }
      #loading .tip b { color: var(--orange-2); font: 700 13px var(--display); letter-spacing: 2px; display: block; }

      /* ================= Shell (title / contracts / results / failed) ================= */
      #shell { position: fixed; inset: 0; z-index: 34; display: none; }
      #shell.on { display: block; }
      #shell .kicker { font: 700 13px var(--display); letter-spacing: 4px; text-transform: uppercase; color: var(--orange-2); }
      #shell::before { content: ''; position: absolute; inset: 0; pointer-events: none; }
      #shell.s-title::before { background: linear-gradient(90deg, rgba(8,10,16,0.78) 0%, rgba(8,10,16,0.35) 38%, transparent 60%), linear-gradient(0deg, rgba(8,10,16,0.55), transparent 30%); }
      #shell.s-contracts::before, #shell.s-credits::before { background: rgba(8,10,16,0.6); backdrop-filter: blur(3px); }
      #shell.s-results::before { background: radial-gradient(ellipse at 40% 50%, rgba(8,10,16,0.45), rgba(8,10,16,0.82)); }
      #shell.s-failed::before { background: radial-gradient(ellipse at 50% 45%, rgba(40,8,8,0.5), rgba(8,4,4,0.9)); }

      .sbtn { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; border: 0; cursor: pointer; color: #f4f1ea;
        font: 700 22px var(--display); letter-spacing: 1.2px; text-transform: uppercase; padding: 10px 22px 10px 18px; border-radius: 10px;
        background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.1); transition: transform 0.12s, background 0.12s, border-color 0.12s; text-align: left; }
      .sbtn .sub { font: 500 12.5px var(--body); letter-spacing: 0.3px; text-transform: none; opacity: 0.75; }
      .sbtn:hover { transform: translateX(6px); background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.3); }
      .sbtn.primary { background: var(--orange); border-color: var(--orange); color: #1b1108; box-shadow: 0 6px 24px rgba(255,122,47,0.35); }
      .sbtn.primary:hover { background: var(--orange-2); }
      .sbtn.text { background: none; border-color: transparent; font-size: 17px; opacity: 0.8; }

      .title { position: absolute; left: 7vw; top: 0; bottom: 60px; display: flex; flex-direction: column; justify-content: center; gap: min(44px, 4vh); }
      .title .brand h1 { font: 800 clamp(56px, min(9vw, 15vh), 128px)/0.86 var(--display); letter-spacing: 4px; text-shadow: 0 6px 40px rgba(0,0,0,0.45); animation: rise 0.9s cubic-bezier(.2,1,.3,1) both; }
      .title .brand h1 em { font-style: normal; color: var(--orange); display: block; }
      .title .brand .kicker { animation: rise 0.9s 0.1s cubic-bezier(.2,1,.3,1) both; margin-bottom: 10px; }
      .title .tnav { display: flex; flex-direction: column; gap: 10px; width: 320px; }
      .title .tnav .sbtn { animation: rise 0.7s cubic-bezier(.2,1,.3,1) both; }
      .title .tnav .sbtn:nth-child(1) { animation-delay: 0.25s; } .title .tnav .sbtn:nth-child(2) { animation-delay: 0.32s; }
      .title .tnav .sbtn:nth-child(3) { animation-delay: 0.39s; } .title .tnav .sbtn:nth-child(4) { animation-delay: 0.46s; }
      .title .tfoot { position: fixed; left: 7vw; bottom: 28px; font: 500 13px var(--body); opacity: 0.55; }
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

      .contracts { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: min(28px, 3vh); padding: 20px 0; overflow-y: auto; }
      .contracts .chead { text-align: center; }
      .contracts .chead h2 { font: 800 clamp(40px, 8vh, 64px)/1 var(--display); letter-spacing: 3px; }
      .contracts .clist { display: flex; gap: 34px; flex-wrap: wrap; justify-content: center; padding: 0 30px; }
      .contracts .back { position: absolute; left: 30px; top: 26px; }
      .ccard { position: relative; width: 360px; min-height: min(380px, 60vh); background: var(--paper); color: var(--ink); border-radius: 6px; padding: 30px 26px 22px;
        transform: rotate(var(--tilt)); box-shadow: 0 24px 60px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 8px; transition: transform 0.2s cubic-bezier(.2,1.3,.4,1);
        animation: rise 0.6s cubic-bezier(.2,1,.3,1) both; }
      .ccard:nth-child(2) { animation-delay: 0.08s; }
      .ccard:hover { transform: rotate(0deg) translateY(-6px); }
      .ccard .pin { position: absolute; top: -9px; left: 50%; width: 20px; height: 20px; border-radius: 50%; transform: translateX(-50%);
        background: radial-gradient(circle at 35% 35%, #ff9d6b, #c2361e); box-shadow: 0 3px 4px rgba(0,0,0,0.35); }
      .ccard .no { font: 700 12px var(--display); letter-spacing: 2px; opacity: 0.45; }
      .ccard .client { font: 700 13px var(--display); letter-spacing: 1.5px; text-transform: uppercase; color: #b4561b; }
      .ccard h3 { font: 800 38px/1 var(--display); letter-spacing: 0.5px; }
      .ccard p { font: 500 14.5px/1.5 var(--body); color: #3a3f4a; flex: 1; }
      .ccard .meta { display: flex; gap: 14px; font: 700 13px var(--display); letter-spacing: 1.5px; text-transform: uppercase; opacity: 0.6; }
      .ccard .rec { display: flex; align-items: center; gap: 10px; min-height: 30px; font: 700 14px var(--display); letter-spacing: 1px; }
      .ccard .rec .new { color: #1f8a4a; } .ccard .rec .lock { color: #8a8375; }
      .ccard .gr { font: 800 22px var(--display); border: 2.5px solid currentColor; border-radius: 6px; padding: 0 8px; line-height: 1.2; }
      .ccard .sbtn { align-self: stretch; align-items: center; margin-top: 4px; color: var(--ink); background: rgba(20,24,32,0.06); border-color: rgba(20,24,32,0.14); }
      .ccard .sbtn.primary { color: #1b1108; background: var(--orange); border-color: var(--orange); }
      .ccard .sbtn:hover { transform: none; }
      .ccard.locked { filter: saturate(0.2) brightness(0.72); }
      .ccard.locked::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, transparent 0 18px, rgba(20,24,32,0.05) 18px 36px); border-radius: 6px; }
      .ccard .donestamp { position: absolute; right: 16px; top: 64px; transform: rotate(-12deg); font: 800 26px var(--display); letter-spacing: 3px; color: #1f8a4a;
        border: 3.5px solid currentColor; border-radius: 6px; padding: 0 10px; opacity: 0.75; }
      .gS { color: #d4a017; } .gA { color: #1f8a4a; } .gB { color: #2b6cb0; } .gC { color: #9a6a1f; } .gD { color: #b83a2e; }

      .results { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(420px, 520px) 300px; grid-template-rows: 1fr auto; gap: 26px 50px;
        align-content: center; justify-content: center; padding: 40px; }
      .rsheet { background: var(--paper); color: var(--ink); border-radius: 8px; padding: 34px 32px 26px; transform: rotate(-1deg); box-shadow: 0 30px 80px rgba(0,0,0,0.55);
        animation: slidein 0.6s cubic-bezier(.2,1.1,.3,1) both; position: relative; }
      .rsheet h2 { font: 800 46px/1 var(--display); letter-spacing: 1px; margin: 4px 0 16px; }
      .rsheet .kicker { color: #b4561b !important; }
      .rstamp { position: absolute; right: -18px; top: 26px; transform: rotate(8deg) scale(1); font: 800 30px var(--display); letter-spacing: 3px; color: #1f8a4a;
        border: 4px solid currentColor; border-radius: 8px; padding: 2px 14px 0; background: rgba(246,239,220,0.85); animation: stampin 0.5s 0.25s cubic-bezier(.2,1.6,.4,1) both; }
      .rgrid { display: flex; flex-direction: column; gap: 2px; }
      .rrow { display: grid; grid-template-columns: 1fr auto 90px; gap: 14px; align-items: center; padding: 9px 0; border-bottom: 1.5px dashed rgba(20,24,32,0.18);
        animation: rise 0.45s cubic-bezier(.2,1,.3,1) both; }
      .rrow .lb { font: 700 19px var(--display); letter-spacing: 0.5px; }
      .rrow .vl { font: 600 15px var(--body); color: #3a3f4a; font-variant-numeric: tabular-nums; }
      .rrow .pt { height: 8px; background: rgba(20,24,32,0.1); border-radius: 99px; overflow: hidden; }
      .rrow .pt i { display: block; height: 100%; background: linear-gradient(90deg, #1f8a4a, #5fd08a); border-radius: 99px; }
      .rfoot { margin-top: 14px; font: 600 13px var(--body); color: #4a4f5a; min-height: 18px; }
      .rfoot .nb { color: #b4561b; font-weight: 700; }
      .rgrade { align-self: center; text-align: center; animation: stampin 0.6s 1.05s cubic-bezier(.2,1.6,.4,1) both; }
      .rgrade .letter { font: 800 220px/0.85 var(--display); text-shadow: 0 10px 50px rgba(0,0,0,0.5); -webkit-text-stroke: 3px rgba(0,0,0,0.15); }
      .rgrade .word { font: 800 28px var(--display); letter-spacing: 3px; text-transform: uppercase; color: #f4f1ea; margin-top: 8px; }
      .rgrade .score { font: 700 15px var(--display); letter-spacing: 3px; color: #f4f1ea; opacity: 0.6; }
      .rgrade.gS .letter { color: #ffd34d; } .rgrade.gA .letter { color: #6be39a; } .rgrade.gB .letter { color: #74b3ff; }
      .rgrade.gC .letter { color: #ffb347; } .rgrade.gD .letter { color: #ff6b5b; }
      .rnav { grid-column: 1 / 3; display: flex; gap: 12px; justify-content: center; animation: rise 0.5s 1.4s both; }
      .rnav .sbtn { align-items: center; min-width: 200px; }
      .rnav .sbtn:hover { transform: translateY(-3px); }
      @keyframes slidein { from { opacity: 0; transform: translateY(40px) rotate(2deg); } to { opacity: 1; transform: rotate(-1deg); } }
      @keyframes stampin { from { opacity: 0; transform: rotate(8deg) scale(2.2); } to { opacity: 1; transform: rotate(8deg) scale(1); } }
      .rgrade { transform-origin: center; }
      .rgrade { animation-name: gradein; }
      @keyframes gradein { from { opacity: 0; transform: scale(2.4) rotate(-10deg); } to { opacity: 1; transform: scale(1) rotate(-4deg); } }

      .failed { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; }
      .failed .fbox { text-align: center; max-width: 620px; animation: rise 0.6s both; }
      .failed .kicker { color: var(--bad) !important; }
      .failed h2 { font: 800 84px/0.95 var(--display); letter-spacing: 3px; margin: 8px 0 14px; color: #fff; text-shadow: 0 6px 40px rgba(255,60,40,0.35); }
      .failed p { font: 500 17px/1.5 var(--body); opacity: 0.85; }
      .failed .tip { margin-top: 22px; background: var(--glass-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 18px; font: 500 15px/1.5 var(--body); text-align: left; }
      .failed .tip b { display: block; font: 800 12px var(--display); letter-spacing: 2.5px; color: var(--orange-2); text-transform: uppercase; }
      .failed .rnav { animation-delay: 0.3s; }

      .credits { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
      .credits .paper { background: var(--paper); color: var(--ink); border-radius: 8px; padding: 32px 36px; width: 460px; transform: rotate(-0.8deg); box-shadow: 0 24px 60px rgba(0,0,0,0.5); }
      .credits h2 { font: 800 44px var(--display); letter-spacing: 1px; margin-bottom: 10px; }
      .credits p { font: 500 14.5px/1.5 var(--body); margin-top: 12px; color: #3a3f4a; }
      .credits p b { font: 700 13px var(--display); letter-spacing: 2px; text-transform: uppercase; color: #b4561b; }
      .credits .thanks { font-style: italic; color: #3b5bb5; }

      /* ================= Pause / settings ================= */
      .overlay { position: fixed; inset: 0; z-index: 36; display: flex; align-items: center; justify-content: center;
        background: rgba(8,10,16,0.62); backdrop-filter: blur(6px); }
      .menu-panel { width: min(620px, 92vw); max-height: 88vh; display: flex; flex-direction: column; background: var(--glass-2); border: 1px solid var(--line);
        border-radius: 16px; padding: 28px 30px; box-shadow: 0 30px 80px rgba(0,0,0,0.5); animation: rise 0.3s cubic-bezier(.2,1,.3,1) both; }
      .menu-title { font: 800 48px/1 var(--display); letter-spacing: 3px; }
      .menu-sub { font: 500 14px var(--body); opacity: 0.7; margin-top: 6px; }
      .menu-col { display: flex; flex-direction: column; gap: 8px; margin-top: 22px; }
      .btn { font: 700 19px var(--display); letter-spacing: 1.2px; text-transform: uppercase; padding: 11px 18px; border-radius: 10px; cursor: pointer; text-align: left;
        color: #1b1108; background: var(--orange); border: 1.5px solid var(--orange); transition: transform 0.12s, background 0.12s; }
      .btn:hover { transform: translateX(4px); }
      .btn.btn-ghost { color: #f4f1ea; background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
      .btn.btn-ghost:hover { background: rgba(255,255,255,0.13); }
      .menu-scroll { overflow-y: auto; margin-top: 16px; padding-right: 8px; display: flex; flex-direction: column; }
      .menu-scroll::-webkit-scrollbar { width: 6px; } .menu-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
      .menu-scroll .btn { margin-top: 10px; font-size: 15px; }
      .menu-group { font: 800 13px var(--display); letter-spacing: 3px; text-transform: uppercase; color: var(--orange-2); margin: 18px 0 6px; }
      .menu-group:first-child { margin-top: 0; }
      .menu-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font: 500 14.5px var(--body); }
      .menu-note { font: 500 12.5px var(--body); opacity: 0.55; padding: 6px 0; }
      .menu-ctrl { display: flex; align-items: center; gap: 10px; }
      .menu-ctrl input[type=range] { width: 180px; accent-color: var(--orange); }
      .menu-val { width: 44px; text-align: right; font: 700 14px var(--display); letter-spacing: 1px; opacity: 0.8; font-variant-numeric: tabular-nums; }
      .menu-toggle, .menu-key, .menu-seg button { font: 700 13px var(--display); letter-spacing: 1.5px; padding: 5px 12px; border-radius: 7px; cursor: pointer;
        color: #f4f1ea; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); min-width: 64px; }
      .menu-toggle.on { background: var(--good); color: #0e2a18; border-color: var(--good); }
      .menu-key { background: var(--cream); color: var(--ink); box-shadow: 0 2px 0 #b9ae93; min-width: 90px; }
      .menu-seg { display: flex; gap: 4px; }
      .menu-seg button.active { background: var(--orange); color: #1b1108; border-color: var(--orange); }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="hud" class="off">
      <div id="hurt"></div>
      <div id="frost"></div>
      <div id="reticle">
        <div class="dot"></div>
        <svg viewBox="0 0 68 68">
          <circle class="ring" cx="34" cy="34" r="14" />
          <circle class="band" cx="34" cy="34" r="22" />
          <circle class="torque" cx="34" cy="34" r="22" />
          <circle class="hold" cx="34" cy="34" r="18" />
        </svg>
      </div>
      <div id="prompt"><div class="row"><span class="key">E</span><span class="label"></span></div><div class="why"></div></div>
      <div id="objective"><div class="tag">Current job</div><div class="text"></div><div class="detail"></div><div class="clock"></div></div>
      <div id="waypoint"><div class="pin"></div><div class="dist"></div></div>
      <div id="carry"></div>
      <div id="belt"></div>
      <div id="vitals">
        <div class="meter hp off"><span>HEALTH</span><div class="bar"><i></i></div></div>
        <div class="meter cold off"><span>COLD</span><div class="bar"><i></i></div></div>
        <div class="meter stam off"><span>STAMINA</span><div class="bar"><i></i></div></div>
      </div>
      <div id="drive"><div class="spd">0</div><div class="unit">KM/H</div><div class="integ"><span>VEHICLE</span><div class="bar"><i></i></div></div><div class="keys"></div></div>
      <div id="radio"><div class="who"><span class="wave"><i></i><i></i><i></i><i></i></span><span class="nm">Dispatch</span></div><div class="line"></div></div>
      <div id="stamp"><span class="t"></span><span class="s"></span></div>

    <div id="loading">
