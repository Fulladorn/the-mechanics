name: Task
description: A PM-generated work item for a sub-agent or human contributor.
title: ""
labels: []
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "sim (rules, machines, physics)"
        - "content / levels"
        - "render / art"
        - "HUD / UI"
        - "audio"
        - "input / settings"
        - "tools / tests"
        - "docs / process"
    validations:
      required: true

  - type: input
    id: issue-class
    attributes:
      label: Gameplay issue class
      description: >
        For gameplay problems: the row number in docs/gameplay-issues.md
        (e.g. "#4 Steps without exact targets"), or "new class" if none fits.
        Leave blank otherwise.
    validations:
      required: false

  - type: dropdown
    id: type
    attributes:
      label: Task type
      options:
        - feature
        - bug
        - test
        - content
        - design
        - process
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "p0 — broken or blocking play"
        - "p1 — needed this week"
        - "p2 — backlog"
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: Suggested agent
      description: Which agent or person should handle this?
      options:
        - "@coder"
        - "@test-writer"
        - "@reviewer"
        - "@level-designer"
        - "human"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: >
        One or two sentences on why this matters. Link the relevant section of
        docs/ROADMAP.md, docs/GAME_DESIGN.md or docs/gameplay-issues.md.
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: What to build / change
      description: >
        Bullet list of concrete deliverables. Reference specific files/modules
        where known (e.g. `src/sim/machine.ts`, `src/content/levels/ridge.ts`).
      placeholder: |
        - `src/sim/foo.ts` — add X
        - `src/client/bar.ts` — wire Y to Z
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable, testable conditions. The PR is not mergeable until all boxes are checked.
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3
    validations:
      required: true

  - type: textarea
    id: tests
    attributes:
      label: Tests required
      description: >
        Which test file(s) (test/**/*.spec.ts) or checks (targetcheck, walkthrough,
        playtest) prove it? Reference the acceptance criteria they cover. Leave blank only if this is a docs/config-only change.
      placeholder: |
        - `test/foo.spec.ts` — covers criteria 1 and 2
        - `node tools/targetcheck.mjs` clean / walkthrough screenshots reviewed
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes / open questions
      description: >
        Anything the assignee should know: related issues, design constraints,
        tradeoffs, or questions that need answering before work starts.
    validations:
      required: false
